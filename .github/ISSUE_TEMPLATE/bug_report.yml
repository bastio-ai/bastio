name: Bug Report
description: File a bug report to help us improve Bastio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce the issue.
  - type: input
    id: version
    attributes:
      label: Bastio Version
      description: What version of Bastio are you running? (e.g., v0.1.0 or latest)
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Are you using Docker Compose, the single binary, or Kubernetes? Which OS?
      placeholder: Docker Compose on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Run 'docker compose up'
        2. Make a request to '/v1/chat/completions' with the following payload...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Traces
      description: Please paste any relevant logs from the bastio server or dashboard console.
      render: shell
    validations:
      required: false
