name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: mcp-ci-test
          POSTGRES_DB: bastio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_TEST_DATABASE_URL: postgres://postgres:mcp-ci-test@localhost:5432/bastio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Verify modules tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./...

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate typed API client
        run: npm run generate:api

      - name: Detect schema drift
        run: |
          if ! git diff --quiet -- src/api/schema.ts; then
            echo "::error::dashboard/src/api/schema.ts is out of date — run 'npm run generate:api' and commit the result"
            git diff -- src/api/schema.ts
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Artifact preview tests
        run: npm run test:artifacts

      - name: Gateway setup tests
        run: npm run test:gateways

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [go, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: bastio/bastio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.15.0

      # Lint catches malformed templates, missing required fields,
      # invalid YAML. Template renders the chart with a known-good
      # values set and verifies it produces valid Kubernetes manifests
      # — this catches `nil pointer` template errors that lint misses.
      - name: Lint
        run: helm lint deploy/helm/bastio

      - name: Render with required values
        run: |
          helm template ci-test deploy/helm/bastio \
            --set secrets.databaseURL='postgres://stub:stub@stub:5432/stub' \
            --set secrets.redisURL='redis://stub:6379/0' \
            > /tmp/manifests.yaml
          test -s /tmp/manifests.yaml
          grep -q "kind: Deployment" /tmp/manifests.yaml
          grep -q "kind: Service" /tmp/manifests.yaml
