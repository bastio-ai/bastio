openapi: "3.1.0"
info:
  title: Bastio API
  description: AI Security Gateway API
  version: "0.1.0"
  license:
    name: FSL-1.1-ALv2
    url: https://fsl.software/FSL-1.1-ALv2.template.md

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Developer APIs
    description: Standalone inline threat scanning, reversible PII redaction, and autonomous agent tool call guardrails.
  - name: Gateway
    description: OpenAI and Anthropic compatible LLM security proxies.
  - name: Observability
    description: Traces, sessions, user metrics, and Redis response cache settings.
  - name: Security
    description: Security profile rules and configuration.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more services unhealthy

  /v1:
    get:
      operationId: getVersion
      summary: API version info
      tags: [System]
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string

  # Standalone Developer APIs & Guardrails
  /v1/detect:
    post:
      operationId: detect
      summary: Inline Threat & Prompt Injection Scanner
      description: Run security profile steps against prompt text without proxying a full LLM call.
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
      responses:
        "200":
          description: Detection outcome
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Cache status header

  /v1/pii/mask:
    post:
      operationId: maskPII
      summary: Standalone PII & Secret Redaction and Tokenization
      description: Mask sensitive data into synthetic placeholders.
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIMaskRequest"
      responses:
        "200":
          description: Masked and tokenized content
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]

  /v1/pii/unmask:
    post:
      operationId: unmaskPII
      summary: Restore original PII tokens in LLM output
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIUnmaskRequest"
      responses:
        "200":
          description: Unmasked content

  /v1/guardrails/agent-action:
    post:
      operationId: inspectAgentAction
      summary: Autonomous Agent Tool Call Guardrails
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionRequest"
      responses:
        "200":
          description: Tool call guardrail decision
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]

  # Gateway proxy endpoints
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      summary: OpenAI-compatible chat completions proxy
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
        "403":
          description: Request blocked by security policy
        "429":
          description: Rate limited

  /v1/guard/{proxyId}/v1/messages:
    post:
      operationId: anthropicMessages
      summary: Anthropic Messages API proxy with security scanning
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: proxyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Anthropic messages response
        "403":
          description: Request blocked by security policy

  /v1/dashboard/cache-settings:
    get:
      operationId: getCacheSettings
      summary: Retrieve Redis cache metrics and status
      tags: [Observability]
      responses:
        "200":
          description: Cache configuration and live hit/miss metrics
    put:
      operationId: updateCacheSettings
      summary: Update Redis response cache settings
      tags: [Observability]

  /v1/dashboard/cache:
    delete:
      operationId: flushCache
      summary: Flush Redis response cache
      tags: [Observability]

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer sk-bastio-..."

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]

    DetectRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
        profile:
          type: string
        direction:
          type: string
          enum: [input, output]
        bypass_cache:
          type: boolean
          default: false

    PIIMaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        mode:
          type: string
          enum: [tokenize, mask, redact]
        bypass_cache:
          type: boolean

    PIIUnmaskRequest:
      type: object
      required: [text, tokens]
      properties:
        text:
          type: string
        tokens:
          type: object

    AgentActionRequest:
      type: object
      required: [tool_name, arguments]
      properties:
        tool_name:
          type: string
        arguments:
          type: object
        agent_role:
          type: string
        context:
          type: string
