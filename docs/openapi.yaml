openapi: "3.1.0"
info:
  title: Bastio API
  description: AI Security Gateway API
  version: "0.1.0"
  license:
    name: FSL-1.1-ALv2
    url: https://fsl.software/FSL-1.1-ALv2.template.md

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Developer APIs
    description: Standalone inline threat scanning, reversible PII redaction, and autonomous agent tool call guardrails.
  - name: Gateway
    description: OpenAI and Anthropic compatible LLM security proxies.
  - name: Observability
    description: Traces, sessions, user metrics, and Redis response cache settings.
  - name: Security
    description: Security profile rules and configuration.

paths:
  /v1/batches:
    post:
      operationId: createNativeBatch
      summary: Create an inspected OpenAI batch
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    get:
      operationId: listNativeBatches
      summary: List batches registered in this tenant and credential scope
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/batches/{batch_id}:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getNativeBatch
      summary: Retrieve an OpenAI batch and register its output files
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/batches/{batch_id}/cancel:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelNativeBatch
      summary: Cancel an OpenAI batch
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/files:
    post:
      operationId: uploadNativeFile
      summary: Upload an OpenAI file; purpose=batch JSONL is inspected before upload
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { type: string }
              additionalProperties: true
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    get:
      operationId: listNativeFiles
      summary: List files registered in this tenant and credential scope
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/files/{file_id}:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getNativeFile
      summary: Retrieve an OpenAI file
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    delete:
      operationId: deleteNativeFile
      summary: Delete an OpenAI file
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/files/{file_id}/content:
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadNativeFile
      summary: Download an inspected batch output or error file
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/messages/batches:
    post:
      operationId: createClaudeMessageBatch
      summary: Create an inspected Anthropic Message Batch
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    get:
      operationId: listClaudeMessageBatches
      summary: List registered Anthropic Message Batches
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/messages/batches/{batch_id}:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getClaudeMessageBatch
      summary: Retrieve an Anthropic Message Batch
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/messages/batches/{batch_id}/cancel:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: cancelClaudeMessageBatch
      summary: Cancel an Anthropic Message Batch
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/messages/batches/{batch_id}/results:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadClaudeMessageBatch
      summary: Download inspected Anthropic JSONL results
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native provider format. Upload/create through the same tenant, proxy and provider credential. Unknown or expired resources return 404. Input and result items use current directional security policies. See /docs/batch-apis for limits and encrypted operational retention."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /v1/google/{endpoint}:
    parameters:
      - name: endpoint
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: googleNativeGet
      summary: Retrieve Gemini API jobs, files and inspected results
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native wildcard endpoint, including nested v1beta job/file paths, upload/v1beta/files and download/v1beta/files. Also mounted at /v1/gemini. Official Google SDK x-goog-api-key is accepted. Text is inspected; binary media is opaque. See /docs/batch-apis."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    post:
      operationId: googleNativePost
      summary: Submit Gemini native requests, batches and resumable uploads
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native wildcard endpoint, including nested v1beta job/file paths, upload/v1beta/files and download/v1beta/files. Also mounted at /v1/gemini. Official Google SDK x-goog-api-key is accepted. Text is inspected; binary media is opaque. See /docs/batch-apis."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
    delete:
      operationId: googleNativeDelete
      summary: Delete a registered Gemini batch or file
      tags: [Gateway]
      security: [{ ApiKeyAuth: [] }]
      description: "Native wildcard endpoint, including nested v1beta job/file paths, upload/v1beta/files and download/v1beta/files. Also mounted at /v1/gemini. Official Google SDK x-goog-api-key is accepted. Text is inspected; binary media is opaque. See /docs/batch-apis."
      responses:
        default:
          description: Native provider response or gateway security/validation error. Inspected downloads are buffered until complete validation and reject Range requests.
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more services unhealthy

  /v1:
    get:
      operationId: getVersion
      summary: API version info
      tags: [System]
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string

  # Standalone Developer APIs & Guardrails
  /v1/detect:
    post:
      operationId: detect
      summary: Inline Threat & Prompt Injection Scanner
      description: Run security profile steps against prompt text without proxying a full LLM call.
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
      responses:
        "200":
          description: Detection outcome
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Cache status header

  /v1/pii/mask:
    post:
      operationId: maskPII
      summary: Standalone PII & Secret Redaction and Tokenization
      description: Mask sensitive data into synthetic placeholders.
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIMaskRequest"
      responses:
        "200":
          description: Masked and tokenized content
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]

  /v1/pii/unmask:
    post:
      operationId: unmaskPII
      summary: Restore original PII tokens in LLM output
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIUnmaskRequest"
      responses:
        "200":
          description: Unmasked content

  /v1/guardrails/agent-action:
    post:
      operationId: inspectAgentAction
      summary: Autonomous Agent Tool Call Guardrails
      tags: [Developer APIs]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionRequest"
      responses:
        "200":
          description: Tool call guardrail decision
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]

  # Gateway proxy endpoints
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      summary: OpenAI-compatible chat completions proxy
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
        "403":
          description: Request blocked by security policy
        "429":
          description: Rate limited

  /v1/guard/{proxyId}/v1/messages:
    post:
      operationId: anthropicMessages
      summary: Anthropic Messages API proxy with security scanning
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: proxyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Anthropic messages response
        "403":
          description: Request blocked by security policy

  /v1/dashboard/cache-settings:
    get:
      operationId: getCacheSettings
      summary: Retrieve Redis cache metrics and status
      tags: [Observability]
      responses:
        "200":
          description: Cache configuration and live hit/miss metrics
    put:
      operationId: updateCacheSettings
      summary: Update Redis response cache settings
      tags: [Observability]

  /v1/dashboard/cache:
    delete:
      operationId: flushCache
      summary: Flush Redis response cache
      tags: [Observability]

  /v1/proxies/{id}/models:
    get:
      operationId: listGatewayTestModels
      summary: Discover chat models using this gateway's actual provider credential
      description: Owner/admin dashboard session required. Uses the normal scoped gateway pipeline. Provider-reported models are suggestions; inference confirms model access. Providers without native model discovery return source catalog.
      tags: [Gateway]
      security: [{ DashboardSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Provider model list or explicit catalogue fallback
          content:
            application/json:
              schema:
                type: object
                required: [provider, source, models]
                properties:
                  provider: { type: string }
                  source: { type: string, enum: [provider, catalog] }
                  models:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        name: { type: string }
        "401": { description: Dashboard session required }
        "403": { description: Workspace owner or admin role required, or provider access denied }
        "404": { description: Gateway not found or disabled }
        "429": { description: Rate or usage limit exceeded }
        "502": { description: Provider configuration or model discovery failed }
  /v1/proxies/{id}/test:
    post:
      operationId: testGateway
      summary: Send a small fixed hello through this gateway
      description: Owner/admin dashboard session and trusted Origin required. Server issues a gateway-scoped key that expires in two minutes and deletes it after the request. Normal authentication, security, billing, and quota middleware applies. Provider charges apply. No API key is returned to the browser.
      tags: [Gateway]
      security: [{ DashboardSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: false
              properties:
                model: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Provider completion through normal security controls
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Invalid model or request body }
        "401": { description: Dashboard session or provider authentication failed }
        "402": { description: Billing or usage limit exceeded }
        "403": { description: Role, trusted origin, security policy, or provider model access denied }
        "404": { description: Gateway or model not found }
        "429": { description: Rate or usage limit exceeded }
        "502": { description: Provider request failed }
        "503": { description: Temporary gateway credentials unavailable }

  /v1/workspace/me/models:
    get:
      operationId: listWorkspaceModels
      tags: [Workspace]
      summary: Models reported by current workspace credentials, filtered by member policy
      parameters:
        - { name: manage, in: query, schema: { type: boolean }, description: Owner/admin only; show models before applying the member allowlist }
      responses:
        "200":
          description: Provider discovery and dated model test evidence; neither guarantees future inference access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceModelInventory" }
        "403": { description: Admin role required for manage mode }
        "503": { description: Model policy unavailable }
  /v1/workspace/models/discover:
    post:
      operationId: discoverWorkspaceModels
      tags: [Workspace]
      summary: Refresh a provider's model inventory using the workspace credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider: { type: string }
      responses:
        "200":
          description: Refreshed provider inventory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceProviderModels" }
        "400": { description: Invalid provider }
        "403": { description: Owner/admin role required }
  /v1/workspace/models/test:
    post:
      operationId: testWorkspaceModel
      tags: [Workspace]
      summary: Send a bounded hello through the normal workspace security and spending pipeline
      description: Owner/admin only. Provider charges apply. Tests do not retain content or appear in conversation lists. Usage accounting and traces remain. Rotating the provider key invalidates past evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Test outcome
          content:
            application/json:
              schema:
                type: object
                required: [success, reply, checked_at]
                properties:
                  success: { type: boolean }
                  reply: { type: string }
                  error_code: { type: string }
                  checked_at: { type: string, format: date-time }
        "400": { description: Invalid model or missing provider connection }
        "403": { description: Owner/admin role required }
        "429": { description: Model test rate limit exceeded }
        "503": { description: Test or evidence storage unavailable }
  /v1/workspace/setup:
    get:
      operationId: getWorkspaceSetup
      tags: [Workspace]
      summary: Workspace setup progress derived from real configuration and usage
      responses:
        "200":
          description: Setup progress
          content:
            application/json:
              schema:
                type: object
                required: [steps, completed, total, ready, multi_user, members, pending_invitations, ready_knowledge, employee_conversations]
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      required: [id, complete, detail]
                      properties:
                        id: { type: string }
                        complete: { type: boolean }
                        detail: { type: string }
                  multi_user: { type: boolean }
                  completed: { type: integer }
                  total: { type: integer }
                  ready: { type: boolean }
                  members: { type: integer }
                  pending_invitations: { type: integer }
                  ready_knowledge: { type: integer }
                  employee_conversations: { type: integer }
        "403": { description: Owner/admin role required }
        "503": { description: Setup evidence unavailable }
  /v1/workspace/setup/review-privacy:
    post:
      operationId: reviewWorkspacePrivacy
      tags: [Workspace]
      summary: Acknowledge the current storage and spending policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_conversation_content, retention_days, spend_cap_cents]
              properties:
                store_conversation_content: { type: boolean }
                retention_days: { type: integer }
                spend_cap_cents: { type: [integer, "null"] }
      responses:
        "200":
          description: Current policy reviewed
          content:
            application/json:
              schema:
                type: object
                required: [reviewed]
                properties:
                  reviewed: { type: boolean }
        "403": { description: Owner/admin role required }
        "409": { description: Policy changed; refresh before reviewing }
  /v1/workspace/setup/preview:
    get:
      operationId: previewWorkspaceMember
      tags: [Workspace]
      summary: Read-only preview of a current member's permitted shared resources
      description: Does not create an employee session, run models/tools, or reveal another user's personal integrations or credentials.
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Employee permission preview
          content:
            application/json:
              schema:
                type: object
                required: [user_id, email, role, assistants, knowledge, integrations, allowed_models, store_conversation_content, previewed_at]
                properties:
                  user_id: { type: string }
                  email: { type: string }
                  role: { type: string }
                  assistants: { $ref: "#/components/schemas/WorkspacePreviewItems" }
                  knowledge: { $ref: "#/components/schemas/WorkspacePreviewItems" }
                  integrations: { $ref: "#/components/schemas/WorkspacePreviewItems" }
                  allowed_models:
                    type: array
                    items:
                      type: object
                      required: [provider, model]
                      properties:
                        provider: { type: string }
                        model: { type: string }
                  store_conversation_content: { type: boolean }
                  previewed_at: { type: string, format: date-time }
        "403": { description: Owner/admin role required }
        "404": { description: Not a current workspace member }

  /v1/mcp/oauth/client-metadata:
    get:
      operationId: mcpOAuthClientMetadata
      summary: Public OAuth client metadata for Bastio Workspace
      responses:
        '200':
          description: Fixed operator-configured client metadata
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /v1/workspace/mcp/oauth/callback:
    get:
      operationId: workspaceMCPOAuthCallback
      summary: Complete a session-bound, one-use PKCE OAuth flow
      responses:
        '303': { description: Redirect to the configured workspace after validating issuer and state }
        '403': { description: Invalid or expired flow }

  /v1/workspace/mcp/connections/{id}/oauth/discover:
    post:
      operationId: workspaceMCPOAuthDiscover
      summary: Discover an OAuth integration account (owner or administrator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OAuth connection result; credentials are never returned
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: Integration permission denied }

  /v1/workspace/mcp/connections/{id}/oauth/start:
    post:
      operationId: workspaceMCPOAuthStart
      summary: Start an OAuth integration account (owner or administrator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OAuth connection result; credentials are never returned
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: Integration permission denied }

  /v1/workspace/mcp/connections/{id}/oauth/disconnect:
    post:
      operationId: workspaceMCPOAuthDisconnect
      summary: Disconnect an OAuth integration account (owner or administrator)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OAuth connection result; credentials are never returned
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: Integration permission denied }

  /v1/workspace/conversations/{id}/tool-approvals/{approvalID}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: approvalID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: workspaceToolApprovalStatus
      summary: Read an owned conversation's tool approval status
      responses:
        '200':
          description: Operational approval state only
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
    post:
      operationId: workspaceToolApprovalAction
      summary: Explicitly approve or decline one protected tool call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, decline] }
                token: { type: object, additionalProperties: true, description: Tenant-bound encrypted continuation returned with the proposal }
      responses:
        '200':
          description: Completion or protected result; a failed continuation never retries a tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: object, additionalProperties: true }
                  result: { type: string }
                  error: { type: string }
        '409': { description: Approval already consumed, expired, or conversation changed }

components:
  securitySchemes:
    DashboardSession:
      type: apiKey
      in: cookie
      name: bastio_session
      description: Signed-in dashboard session.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer sk-bastio-..."

  schemas:
    WorkspacePreviewItems:
      type: array
      items:
        type: object
        required: [id, name]
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
    WorkspaceModelInventory:
      type: object
      required: [providers, restricted]
      properties:
        restricted: { type: boolean }
        providers:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceProviderModels" }
    WorkspaceProviderModels:
      type: object
      required: [provider, configured, source, models]
      properties:
        provider: { type: string }
        configured: { type: boolean }
        source: { type: string, enum: [provider, catalog] }
        discovered_at: { type: string, format: date-time }
        error_code: { type: string }
        models:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              name: { type: string }
              checked_at: { type: string, format: date-time }
              check_status: { type: string, enum: [untested, passed, failed] }
              error_code: { type: string }
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]

    DetectRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
        profile:
          type: string
        direction:
          type: string
          enum: [input, output]
        bypass_cache:
          type: boolean
          default: false

    PIIMaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        mode:
          type: string
          enum: [tokenize, mask, redact]
        bypass_cache:
          type: boolean

    PIIUnmaskRequest:
      type: object
      required: [text, tokens]
      properties:
        text:
          type: string
        tokens:
          type: object

    AgentActionRequest:
      type: object
      required: [tool_name, arguments]
      properties:
        tool_name:
          type: string
        arguments:
          type: object
        agent_role:
          type: string
        context:
          type: string
