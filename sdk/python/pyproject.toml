[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bastio"
version = "0.1.0"
description = "Bastio AI Security Gateway Python SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/bastio-ai/bastio"
