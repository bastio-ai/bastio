openapi: "3.1.0"
info:
  title: Bastio API
  description: AI Security Gateway API
  version: "0.1.0"
  license:
    name: FSL-1.1-ALv2
    url: https://fsl.software/FSL-1.1-ALv2.template.md

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Developer APIs
    description: Standalone inline threat scanning, reversible PII redaction, and autonomous agent tool call guardrails.
  - name: Gateway
    description: OpenAI and Anthropic compatible LLM security proxies.
  - name: Observability
    description: Traces, sessions, user metrics, and Redis response cache settings.
  - name: Security
    description: Security profile rules and configuration.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [System]
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more services unhealthy

  /v1:
    get:
      operationId: getVersion
      summary: API version info
      tags: [System]
      responses:
        "200":
          description: API info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string

  /v1/environments:
    get:
      operationId: listEnvironments
      summary: List managed deployment environments
      tags: [Observability]
      responses:
        "200":
          description: Tenant-scoped managed environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
    post:
      operationId: createEnvironment
      summary: Register a deployment environment
      tags: [Observability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnvironmentRequest"
      responses:
        "201":
          description: Environment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          description: Invalid environment name or classification
        "403":
          description: Admin access required
        "409":
          description: Duplicate environment or workspace limit reached

  # Gateway proxy endpoints (Phase 2)
  /v1/chat/completions:
    post:
      operationId: chatCompletions
      summary: OpenAI-compatible chat completions proxy
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response
        "403":
          description: Request blocked by security policy
        "429":
          description: Rate limited

  /v1/guard/{proxyId}/v1/messages:
    post:
      operationId: anthropicMessages
      summary: Anthropic Messages API proxy with security scanning
      tags: [Gateway]
      security:
        - ApiKeyAuth: []
      parameters:
        - name: proxyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Anthropic messages response
        "403":
          description: Request blocked by security policy

  # Management API
  /v1/proxies:
    get:
      operationId: listProxies
      summary: List proxies
      tags: [Proxies]
      responses:
        "200":
          description: List of proxies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Proxy"
    post:
      operationId: createProxy
      summary: Create a proxy
      tags: [Proxies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProxyRequest"
      responses:
        "201":
          description: Proxy created

  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List API keys
      tags: [API Keys]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
    post:
      operationId: createApiKey
      summary: Create an API key
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: API key created (key shown only once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyWithSecret"

  /v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags: [API Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked

  /v1/config:
    get:
      operationId: getAppConfig
      summary: Runtime configuration of the Bastio server
      tags: [System]
      responses:
        "200":
          description: App config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /v1/provider-keys:
    get:
      operationId: listProviderKeys
      summary: List stored LLM provider API keys (masked)
      tags: [Provider Keys]
      responses:
        "200":
          description: Masked provider keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderKey"
    post:
      operationId: createProviderKey
      summary: Store a new provider API key (encrypted at rest)
      tags: [Provider Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderKeyRequest"
      responses:
        "201":
          description: Provider key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderKey"

  /v1/provider-keys/{id}:
    delete:
      operationId: deleteProviderKey
      summary: Delete a stored provider key
      tags: [Provider Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /v1/proxies/{id}:
    get:
      operationId: getProxy
      summary: Get a single proxy
      tags: [Proxies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proxy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"
        "404":
          description: Proxy not found
    put:
      operationId: updateProxy
      summary: Update a proxy
      tags: [Proxies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProxyRequest"
      responses:
        "200":
          description: Updated proxy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"
    delete:
      operationId: deleteProxy
      summary: Delete a proxy
      tags: [Proxies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted

  /v1/proxies/{id}/provider-keys:
    get:
      operationId: listProviderKeysForProxy
      summary: Provider keys available to a proxy
      tags: [Proxies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Provider keys for this proxy (defaults + proxy-scoped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderKey"

  /v1/security/profiles/{id}:
    put:
      operationId: updateSecurityProfile
      summary: Update individual fields on a security profile
      tags: [Security]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecurityProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string

  /v1/traces:
    get:
      operationId: listTraces
      summary: List traces with filters
      tags: [Observability]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: end_user_id
          in: query
          schema:
            type: string
        - name: proxy_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Case-insensitive substring match on path.
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: environment
          in: query
          schema:
            type: string
        - name: release
          in: query
          schema:
            type: string
        - name: trace_name
          in: query
          schema:
            type: string
        - name: tag
          in: query
          description: key:value pair; repeat for multiple AND-ed tag filters.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Paginated traces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trace"

  /v1/traces/{id}:
    get:
      operationId: getTrace
      summary: Get a trace with span hierarchy
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Trace detail with ordered spans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceDetail"
        "404":
          description: Trace not found

  /v1/traces/{id}/scores:
    get:
      operationId: listTraceScores
      summary: List scores attached to a trace
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scores for the trace (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraceScore"
    post:
      operationId: createTraceScore
      summary: Attach a post-hoc score or label to a trace
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTraceScoreRequest"
      responses:
        "201":
          description: Score recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceScore"

  /v1/traces/{id}/threats:
    get:
      operationId: listTraceThreats
      summary: Per-detector threat detections for a single trace
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Threat detections ordered by severity then score.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraceThreatDetection"

  /v1/sessions:
    get:
      operationId: listSessions
      summary: List sessions (groups of traces sharing session_id)
      tags: [Observability]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: end_user_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: environment
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sessions ordered by most recent activity.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Session aggregates plus all traces in the session
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "404":
          description: Session not found

  /v1/prompts:
    get:
      operationId: listPrompts
      summary: List prompts (OSS registry)
      tags: [Prompts]
      responses:
        "200":
          description: Prompts with their latest version metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prompt"
    post:
      operationId: createPrompt
      summary: Create a prompt and its first version
      tags: [Prompts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptRequest"
      responses:
        "201":
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
        "409":
          description: A prompt with that name already exists.

  /v1/prompts/{name}:
    get:
      operationId: getPrompt
      summary: Fetch a prompt (latest version, or ?version=N / ?label=X)
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: integer }
        - name: label
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Prompt detail (with the resolved version inline)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptDetail"
        "404":
          description: Prompt not found
    delete:
      operationId: deletePrompt
      summary: Delete a prompt (only when it has no versions)
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "409":
          description: Prompt still has versions.

  /v1/prompts/{name}/versions:
    get:
      operationId: listPromptVersions
      summary: List every version of a prompt
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
    post:
      operationId: createPromptVersion
      summary: Append a new immutable version
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePromptVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"

  /v1/prompts/{name}/versions/{version}/labels:
    put:
      operationId: setPromptVersionLabels
      summary: Replace labels on a specific version
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPromptLabelsRequest"
      responses:
        "200":
          description: Updated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptVersion"

  /v1/prompts/{name}/usage:
    get:
      operationId: getPromptUsage
      summary: Traces and spans that referenced this prompt
      tags: [Prompts]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-version summary + recent-trace list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptUsage"

  /v1/users:
    get:
      operationId: listUsers
      summary: List end-users with activity rollups
      tags: [Observability]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: order_by
          in: query
          schema:
            type: string
            enum: [cost, requests, threats, latency]
            default: cost
      responses:
        "200":
          description: Aggregated per-end-user metrics.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAnalytics"

  /v1/users/{id}:
    get:
      operationId: getUser
      summary: End-user detail (sessions, recent traces, threat breakdown)
      tags: [Observability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "404":
          description: User has no traces in this tenant.

  /v1/analytics/users:
    get:
      operationId: listUserAnalytics
      summary: Per-end-user cost / latency / threat rollups
      tags: [Analytics]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: order_by
          in: query
          schema:
            type: string
            enum: [cost, requests, threats, latency]
            default: cost
      responses:
        "200":
          description: Aggregated per-end-user metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAnalytics"

  /v1/threats:
    get:
      operationId: listThreats
      summary: List security threat events
      tags: [Security]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: severity
          in: query
          description: Exact-match severity (critical, high, medium, low).
          schema: { type: string }
        - name: threat_type
          in: query
          description: Exact-match threat category (jailbreak, pii, injection, bot, rate_anomaly, custom_pattern). Comma-separated for multi-value.
          schema: { type: string }
        - name: threat_subtype
          in: query
          description: Exact-match dotted sub-category (e.g. persona.dan, extraction.meta, structural.many_shot). Comma-separated for multi-value.
          schema: { type: string }
        - name: detector_name
          in: query
          description: Exact-match detector name that fired.
          schema: { type: string }
        - name: action_taken
          in: query
          description: Exact-match enforcement outcome (block, redact, warn, pass).
          schema: { type: string }
        - name: end_user_id
          in: query
          schema: { type: string }
        - name: ip_address
          in: query
          schema: { type: string }
        - name: environment
          in: query
          description: Exact-match deployment environment of the related trace.
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: search
          in: query
          description: Case-insensitive substring match across matched_pattern and matched_content.
          schema: { type: string }
        - name: sort
          in: query
          description: Sort column. Unknown values fall back to detected_at.
          schema:
            type: string
            enum: [detected_at, severity, score, confidence]
            default: detected_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Threat events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreatEvent"

  /v1/threats/{id}:
    get:
      operationId: getThreat
      summary: Get a single security threat event
      tags: [Security]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Threat event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatEvent"
        "404":
          description: Threat not found or belongs to another tenant

  /v1/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      summary: Dashboard overview metrics
      tags: [Analytics]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: environment
          in: query
          description: Exact-match deployment environment.
          schema:
            type: string
      responses:
        "200":
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /v1/security/profiles:
    get:
      operationId: listSecurityProfiles
      summary: List security profiles
      tags: [Security]
      responses:
        "200":
          description: Security profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityProfile"

  /v1/detect:
    post:
      operationId: detect
      summary: Run the profile's step list against ad-hoc messages
      description: >
        Used by TypeScript SDKs (Mastra processor, Vercel AI middleware)
        and the dashboard playground. Does not call an upstream LLM — it
        returns the per-step decisions and the sanitized content produced
        by the profile's input/output pipeline.
      tags: [Developer APIs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectRequest"
      responses:
        "200":
          description: Detection outcome per message
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Cache status header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectResponse"
        "400":
          description: Invalid request body

  /v1/pii/mask:
    post:
      operationId: maskPII
      summary: Standalone PII & Secret Redaction and Tokenization
      description: Mask sensitive data (emails, phone numbers, SSNs, credit cards, AWS keys, JWTs) into synthetic placeholders.
      tags: [Developer APIs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIMaskRequest"
      responses:
        "200":
          description: Masked and tokenized content
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Cache status header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIIMaskResponse"

  /v1/pii/unmask:
    post:
      operationId: unmaskPII
      summary: Restore original PII tokens in LLM output
      description: Replace synthetic placeholders with original sensitive values.
      tags: [Developer APIs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PIIUnmaskRequest"
      responses:
        "200":
          description: Unmasked content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PIIUnmaskResponse"

  /v1/guardrails/agent-action:
    post:
      operationId: inspectAgentAction
      summary: Autonomous Agent Tool Call & Action Guardrails
      description: Inspect proposed tool call arguments for system injection, dangerous commands, or path traversal.
      tags: [Developer APIs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentActionRequest"
      responses:
        "200":
          description: Inspection outcome
          headers:
            X-Bastio-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Cache status header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionResponse"

  /v1/dashboard/cache-settings:
    get:
      operationId: getCacheSettings
      summary: Retrieve Redis cache status and metrics
      tags: [Observability]
      responses:
        "200":
          description: Cache configuration and live hit/miss metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheSettings"
    put:
      operationId: updateCacheSettings
      summary: Update Redis response cache settings
      tags: [Observability]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheSettings"
      responses:
        "200":
          description: Updated cache settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheSettings"

  /v1/dashboard/cache:
    delete:
      operationId: flushCache
      summary: Flush Redis response cache and reset counters
      tags: [Observability]
      responses:
        "200":
          description: Cache flushed successfully

  /v1/playground/runs:
    get:
      operationId: listPlaygroundRuns
      summary: List recent Playground run history
      description: >
        Returns the customer's most-recent playground runs in reverse
        chronological order. Populated only when /v1/detect is called
        with source=playground (the dashboard does this automatically).
        Deliberately separate from traces — playground activity does
        not pollute production observability.
      tags: [Playground]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Recent playground runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaygroundRun"

  /v1/playground/runs/{id}:
    delete:
      operationId: deletePlaygroundRun
      summary: Delete a single playground run
      tags: [Playground]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # Custom Policies (tenant-owned overlays layered on top of the core security profile).
  /v1/overlays:
    get:
      operationId: listOverlays
      summary: List custom policies for this customer
      tags: [CustomPolicies]
      responses:
        "200":
          description: Overlays
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayList"
    post:
      operationId: createOverlay
      summary: Create a custom policy and its first draft version
      tags: [CustomPolicies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOverlayRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayCreateResult"

  /v1/overlays/from-template:
    post:
      operationId: createOverlayFromTemplate
      summary: Create a custom policy seeded from a built-in template
      tags: [CustomPolicies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayFromTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayCreateResult"
        "404":
          description: Template not found

  /v1/overlays/{id}:
    get:
      operationId: getOverlay
      summary: Fetch a custom policy with its active version and any loosening warnings
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteOverlay
      summary: Delete a custom policy and all of its versions
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /v1/overlays/{id}/versions:
    get:
      operationId: listOverlayVersions
      summary: List every version of a custom policy
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayVersionList"
    post:
      operationId: createOverlayVersion
      summary: Append a new draft version
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOverlayVersionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayVersionResult"

  /v1/overlays/{id}/versions/{n}:
    get:
      operationId: getOverlayVersion
      summary: Fetch a specific version with loosening warnings
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayVersionDetail"
        "404":
          description: Not found

  /v1/overlays/{id}/versions/{n}/shadow:
    post:
      operationId: promoteOverlayVersionToShadow
      summary: Promote a draft version to shadow state
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayStateTransitionRequest"
      responses:
        "204":
          description: Promoted
        "404":
          description: Not found
        "409":
          description: Invalid state transition

  /v1/overlays/{id}/versions/{n}/activate:
    post:
      operationId: activateOverlayVersion
      summary: Activate a version, superseding the current active one
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayStateTransitionRequest"
      responses:
        "204":
          description: Activated
        "404":
          description: Not found
        "409":
          description: Invalid state transition

  /v1/overlays/{id}/versions/{n}/preview:
    post:
      operationId: previewOverlayVersion
      summary: Replay samples through the candidate effective profile and the current active, returning a diff
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayPreviewRequest"
      responses:
        "200":
          description: Preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayPreviewResult"
        "501":
          description: Preview runner not configured

  /v1/overlays/{id}/rollback:
    post:
      operationId: rollbackOverlay
      summary: Activate the most recently superseded version
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverlayStateTransitionRequest"
      responses:
        "204":
          description: Rolled back
        "409":
          description: No superseded version to roll back to

  /v1/overlays/{id}/audit:
    get:
      operationId: listOverlayAudit
      summary: Audit trail for a custom policy
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayAuditList"

  /v1/overlays/{id}/shadow-events:
    get:
      operationId: listOverlayShadowEvents
      summary: Shadow divergences recorded for this policy
      tags: [CustomPolicies]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Shadow events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayShadowEventList"

  /v1/overlay-templates:
    get:
      operationId: listOverlayTemplates
      summary: List built-in custom-policy templates for common verticals
      tags: [CustomPolicies]
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayTemplateList"

  /v1/overlay-templates/{slug}:
    get:
      operationId: getOverlayTemplate
      summary: Fetch a single template by slug
      tags: [CustomPolicies]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayTemplateDetail"
        "404":
          description: Not found

  # Workspace — multi-model AI chat product. Conversations, assistants,
  # knowledge base, members, analytics. Mounted at /v1/workspace inside
  # the dashboard-auth group; cloud session middleware gates access.
  # See bastio/internal/workspace/.
  # =====================================================================

  /v1/workspace/status:
    get:
      operationId: workspaceStatus
      summary: Workspace status + lazy-create settings
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  customer_id: { type: string, format: uuid }
                  settings:
                    $ref: "#/components/schemas/WorkspaceSettings"

  /v1/workspace/settings:
    get:
      operationId: workspaceGetSettings
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
    patch:
      operationId: workspaceUpdateSettings
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"

  /v1/workspace/me/effective-models:
    get:
      operationId: workspaceGetEffectiveModels
      tags: [Workspace]
      summary: Per-user effective LLM model whitelist
      description: |
        Merged allowed_models list for the calling user.
        Precedence: workspace_members.allowed_models (override) ⟶
        workspace_settings.allowed_models (customer-wide) ⟶ empty
        (open — full catalog visible). Drives the chat surface's
        model picker.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [allowed_models]
                properties:
                  allowed_models:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceAllowedModel" }

  /v1/workspace/assistants:
    get:
      operationId: workspaceListAssistants
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [assistants]
                properties:
                  assistants:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceAssistant"
    post:
      operationId: workspaceCreateAssistant
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAssistant"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssistant"

  /v1/workspace/assistants/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: workspaceGetAssistant
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssistant"
    patch:
      operationId: workspaceUpdateAssistant
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAssistantPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssistant"
    delete:
      operationId: workspaceArchiveAssistant
      tags: [Workspace]
      responses:
        "204": { description: Archived }

  /v1/workspace/knowledge:
    get:
      operationId: workspaceListKnowledge
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceKnowledgeSource"
    post:
      operationId: workspaceCreateKnowledge
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceKnowledgeSource"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceKnowledgeSource"

  /v1/workspace/knowledge/upload:
    post:
      operationId: workspaceUploadKnowledge
      summary: Upload a knowledge file (multipart). Async ingestion.
      description: |
        Multipart form with a `file` field. The server stores the blob,
        creates a `workspace_knowledge_sources` row with status='pending',
        enqueues a River ingestion job, and returns the row immediately.
        The dashboard polls until status flips to 'ready' or 'failed'.
      tags: [Workspace]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Created (ingestion in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceKnowledgeSource"

  /v1/workspace/knowledge/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: workspaceGetKnowledge
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceKnowledgeSource"
    delete:
      operationId: workspaceArchiveKnowledge
      tags: [Workspace]
      responses:
        "204": { description: Archived }

  /v1/workspace/knowledge/{id}/release:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: workspaceReleaseKnowledge
      summary: Release a quarantined knowledge source for re-ingest
      description: |
        Admin-only override that flips a quarantined source back to
        `pending` and re-enqueues the ingest worker. Used when the
        security scan was a false positive (e.g. a doc legitimately
        discusses passwords as part of a security policy and the
        secrets detector tripped). The release action is audited.
        Only valid when the source is currently in `quarantined`
        status; releasing a non-quarantined source returns 409.
      tags: [Workspace]
      responses:
        "200":
          description: Released; ingest re-enqueued
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending] }
        "404": { description: Source not found }
        "409":
          description: Source is not in quarantined status

  /v1/workspace/conversations:
    get:
      operationId: workspaceListConversations
      tags: [Workspace]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceConversationListItem"
    post:
      operationId: workspaceCreateConversation
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                assistant_id: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceConversation"

  /v1/workspace/conversations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: workspaceGetConversation
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceConversation"
    patch:
      operationId: workspaceRenameConversation
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "204": { description: Renamed }
    delete:
      operationId: workspaceArchiveConversation
      tags: [Workspace]
      responses:
        "204": { description: Archived }

  /v1/workspace/conversations/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: workspaceListMessages
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMessage"
    post:
      operationId: workspaceSendMessage
      summary: Send a message (non-streaming, returns full assistant reply)
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSendMessageRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_message, assistant_message]
                properties:
                  user_message:
                    $ref: "#/components/schemas/WorkspaceMessage"
                  assistant_message:
                    $ref: "#/components/schemas/WorkspaceMessage"

  /v1/workspace/conversations/{id}/messages/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: workspaceStreamMessage
      summary: Send a message and stream tokens via Server-Sent Events
      description: |
        Returns a `text/event-stream` with three event types:
        * `token` — `{ "delta": "<text>" }` repeated until the response is complete
        * `done` — `{ "message": <Message> }` with the persisted assistant message
        * `error` — `{ "error": "<message>" }` on transport or provider failure
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSendMessageRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/workspace/analytics/summary:
    get:
      operationId: workspaceAnalyticsSummary
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAnalyticsSummary"

  /v1/workspace/analytics/daily:
    get:
      operationId: workspaceAnalyticsDaily
      tags: [Workspace]
      parameters:
        - in: query
          name: days
          schema: { type: integer, default: 14, maximum: 90 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceDailyUsagePoint"

  /v1/workspace/conversations/{id}/messages/{messageID}:
    delete:
      operationId: workspaceDeleteFromMessage
      tags: [Workspace]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: messageID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted target message and any subsequent messages
  /v1/workspace/chat-attachments:
    post:
      operationId: workspaceUploadChatAttachment
      tags: [Workspace]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /v1/workspace/analytics/by-model:
    get:
      operationId: workspaceAnalyticsByModel
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [by_model]
                properties:
                  by_model:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceByModelCount"
  /v1/workspace/analytics/forecast:
    get:
      operationId: workspaceAnalyticsForecast
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /v1/workspace/analytics/compare:
    get:
      operationId: workspaceAnalyticsCompare
      tags: [Workspace]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: "Bearer sk-bastio-..."

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        postgres:
          type: string
        redis:
          type: string
        clickhouse:
          type: string

    Environment:
      type: object
      required: [id, name, kind, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [production, staging, development, custom]
        description:
