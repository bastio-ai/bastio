      type: object
      required: [detector, strategy]
      properties:
        detector:
          type: string
          description: "Detector name — must match a detector registered in the engine (injection, pii, jailbreak)."
        strategy:
          type: string
          enum: [block, mask, tokenize, warn, log_only]
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: "Weighted score (score × confidence) above which the strategy fires. 0 means any finding fires."
        options:
          type: object
          additionalProperties:
            type: string

    DetectRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DetectMessage"
        profile:
          type: string
          description: "Named security profile to use. Omit or 'default' for the customer's default."
        direction:
          type: string
          enum: [input, output]
          default: input
        steps:
          type: array
          description: "Inline step list that overrides the profile — used by the playground for ad-hoc experiments."
          items:
            $ref: "#/components/schemas/DetectStep"
        source:
          type: string
          description: "Optional tag. Set to 'playground' to persist the run into the dashboard history table. SDK callers should omit this to keep production traffic out of the playground history."
        proxy_id:
          type: string
          format: uuid
          description: "Optional proxy association, recorded on playground runs so the history panel can scope by proxy."
        bypass_cache:
          type: boolean
          default: false
          description: "Set true to force a live scan and bypass Redis response cache."

    PIIMaskRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: "Raw input text to scan and mask."
        mode:
          type: string
          enum: [tokenize, mask, redact]
          default: tokenize
          description: "Masking strategy. tokenize creates reversible placeholders, mask obfuscates with ***, redact replaces with [REDACTED]."
        bypass_cache:
          type: boolean
          default: false

    PIIMaskResponse:
      type: object
      properties:
        processed_text:
          type: string
        tokens:
          type: object
          additionalProperties:
            type: string
        detected_types:
          type: array
          items:
            type: string

    PIIUnmaskRequest:
      type: object
      required: [text, tokens]
      properties:
        text:
          type: string
        tokens:
          type: object
          additionalProperties:
            type: string

    PIIUnmaskResponse:
      type: object
      properties:
        unmasked_text:
          type: string

    AgentActionRequest:
      type: object
      required: [tool_name, arguments]
      properties:
        tool_name:
          type: string
        arguments:
          type: object
        agent_role:
          type: string
        context:
          type: string

    AgentActionResponse:
      type: object
      properties:
        allowed:
          type: boolean
        action:
          type: string
          enum: [allow, block, flag]
        risk_score:
          type: number
        reasons:
          type: array
          items:
            type: string
        sanitized_arguments:
          type: object

    CacheSettings:
      type: object
      properties:
        enabled:
          type: boolean
        ttl_seconds:
          type: integer
        mode:
          type: string
          enum: [redis, memory, disabled]
        hit_count:
          type: integer
        miss_count:
          type: integer
        hit_rate_pct:
          type: number
        avg_latency_saved_ms:
          type: number

    DetectFinding:
      type: object
      properties:
        threat_type:
          type: string
          enum: [injection, pii, jailbreak]
        detector_name:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        score:
          type: number
        confidence:
          type: number
        weighted_score:
          type: number
          description: score × confidence, clamped to [0, 1] — the value compared against the step threshold.
        matched_pattern:
          type: string
        matched_content:
          type: string
        action:
          type: string
        message:
          type: string

    DetectStepResult:
      type: object
      properties:
        detector:
          type: string
        strategy:
          type: string
        fired:
          type: boolean
        skipped:
          type: boolean
          description: "True when the step was configured but not executed because an earlier step short-circuited the pipeline (e.g. block)."
        action:
          type: string
        score:
          type: number
        threshold:
          type: number
          description: "The weighted-score threshold this step was compared against. Useful for diagnosing fired=false at a high-looking score."
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DetectFinding"
        duration:
          type: integer
          description: "Step duration in nanoseconds."

    DetectMessageResult:
      type: object
      properties:
        role:
          type: string
        original:
          type: string
        sanitized_content:
          type: string
        action:
          type: string
        should_block:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DetectStepResult"

    DetectResponse:
      type: object
      properties:
        profile:
          type: string
        direction:
          type: string
          enum: [input, output]
        action:
          type: string
        should_block:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/DetectMessageResult"

    PlaygroundRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profile_name:
          type: string
        proxy_id:
          type: string
          format: uuid
          nullable: true
        direction:
          type: string
          enum: [input, output]
        prompt:
          type: string
        sanitized_content:
          type: string
        action:
          type: string
        should_block:
          type: boolean
        fired_detectors:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DetectStepResult"
        duration_ns:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    # ---- Custom Policies (tenant-owned overlays) ----

    OverlayDetectorOverride:
      type: object
      description: Per-detector threshold/strategy override. Nil fields inherit core defaults.
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 0..1. Higher = less sensitive. Nil = inherit.
        strategy:
          type: string
          description: block | warn | log_only (plus mask for secrets). Nil = inherit.

    OverlayPIIOverride:
      type: object
      properties:
        action:
          type: string
          description: block | mask | tokenize | warn | log_only. Nil = inherit.

    OverlayDetectorOverrides:
      type: object
      description: Overlay cannot disable a core detector — no "enabled" field by design.
      properties:
        injection:
          $ref: "#/components/schemas/OverlayDetectorOverride"
        jailbreak:
          $ref: "#/components/schemas/OverlayDetectorOverride"
        secrets:
          $ref: "#/components/schemas/OverlayDetectorOverride"
        indirect_injection:
          $ref: "#/components/schemas/OverlayDetectorOverride"
        output_exfil:
          $ref: "#/components/schemas/OverlayDetectorOverride"
        pii:
          $ref: "#/components/schemas/OverlayPIIOverride"

    OverlayPatternRule:
      type: object
      required: [name, pattern_type, pattern]
      properties:
        name:
          type: string
        pattern_type:
          type: string
          enum: [regex, keyword, semantic]
        pattern:
          type: string
        action:
          type: string
          enum: [block, warn, log]
        severity:
          type: string
          enum: [low, medium, high, critical]

    OverlayAccessRule:
      type: object
      required: [rule_type, value]
      description: Stored but not yet enforced at runtime.
      properties:
        rule_type:
          type: string
          enum: [ip_allowlist, ip_blocklist, geo_allow, geo_block]
        value:
          type: string

    OverlayPluginDetectorRef:
      type: object
      required: [name]
      properties:
        name:
          type: string
        config:
          description: Opaque JSON config passed to the plugin factory.

    OverlaySnapshot:
      type: object
      required: [schema_version]
      description: Delta-only snapshot — additions + overrides, never a copy of the core profile.
      properties:
        schema_version:
          type: integer
        additional_patterns:
          type: array
          items:
            $ref: "#/components/schemas/OverlayPatternRule"
        additional_access_rules:
          type: array
          items:
            $ref: "#/components/schemas/OverlayAccessRule"
        detector_overrides:
          $ref: "#/components/schemas/OverlayDetectorOverrides"
        plugin_detectors:
          type: array
          items:
            $ref: "#/components/schemas/OverlayPluginDetectorRef"

    Overlay:
      type: object
      required: [id, customer_id, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        proxy_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        active_version_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OverlayVersion:
      type: object
      required: [id, overlay_id, customer_id, version, state, snapshot, source, created_at]
      properties:
        id:
          type: string
          format: uuid
        overlay_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        version:
          type: integer
        state:
          type: string
          enum: [draft, shadow, active, superseded]
        snapshot:
          $ref: "#/components/schemas/OverlaySnapshot"
        source:
          type: string
          description: "manual | template:<slug> | import"
        commit_message:
          type: string
        created_by:
          type: string
        shadow_started_at:
          type: string
          format: date-time
          nullable: true
        activated_at:
          type: string
          format: date-time
          nullable: true
        superseded_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    OverlayAuditEntry:
      type: object
      required: [id, overlay_id, customer_id, event, created_at]
      properties:
        id:
          type: string
          format: uuid
        overlay_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
          nullable: true
        event:
          type: string
          enum: [created, edited, shadowed, activated, rolled_back, deleted]
        actor:
          type: string
        reason:
          type: string
        diff:
          description: JSON Patch (RFC 6902) from prior version. Nullable for create events.
        created_at:
          type: string
          format: date-time

    OverlayShadowEvent:
      type: object
      required:
        [id, customer_id, overlay_id, shadow_version_id, divergence, active_action, shadow_action, created_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        overlay_id:
          type: string
          format: uuid
        shadow_version_id:
          type: string
          format: uuid
        active_version_id:
          type: string
          format: uuid
          nullable: true
        trace_id:
          type: string
          format: uuid
          nullable: true
        divergence:
          type: string
          enum: [would_block, would_allow, threshold_diff, pattern_match_diff, new_detector_fired]
        active_action:
          type: string
        shadow_action:
          type: string
        detail:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    OverlayTemplate:
      type: object
      required: [id, slug, name, description, snapshot, is_builtin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        snapshot:
          $ref: "#/components/schemas/OverlaySnapshot"
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OverlayWarning:
      type: object
      required: [detector, field, from, to, message]
      description: Flags a snapshot override that weakens security relative to the shipped defaults.
      properties:
        detector:
          type: string
        field:
          type: string
          enum: [threshold, strategy, action]
        from:
          type: string
        to:
          type: string
        message:
          type: string

    OverlayPreviewSample:
      type: object
      required: [content]
      properties:
        content:
          type: string

    OverlayPreviewSampleResult:
      type: object
      required: [content, active_action, candidate_action, active_block, candidate_block]
      properties:
        content:
          type: string
        active_action:
          type: string
        candidate_action:
          type: string
        active_block:
          type: boolean
        candidate_block:
          type: boolean
        divergence:
          type: string

    OverlayPreviewSummary:
      type: object
      required: [total, matching, would_block, would_allow, threshold_diff]
      properties:
        total:
          type: integer
        matching:
          type: integer
        would_block:
          type: integer
        would_allow:
          type: integer
        threshold_diff:
          type: integer

    OverlayPreviewResult:
      type: object
      required: [results, summary]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/OverlayPreviewSampleResult"
        summary:
          $ref: "#/components/schemas/OverlayPreviewSummary"

    CreateOverlayRequest:
      type: object
      required: [snapshot]
      properties:
        name:
          type: string
        description:
          type: string
        proxy_id:
          type: string
          format: uuid
        snapshot:
          $ref: "#/components/schemas/OverlaySnapshot"
        commit_message:
          type: string
        source:
          type: string

    CreateOverlayVersionRequest:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          $ref: "#/components/schemas/OverlaySnapshot"
        commit_message:
          type: string
        source:
          type: string

    OverlayStateTransitionRequest:
      type: object
      properties:
        reason:
          type: string

    OverlayFromTemplateRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        proxy_id:
          type: string
          format: uuid
        commit_message:
          type: string

    OverlayPreviewRequest:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/OverlayPreviewSample"
        proxy_id:
          type: string
          format: uuid

    OverlayList:
      type: object
      required: [overlays]
      properties:
        overlays:
          type: array
          items:
            $ref: "#/components/schemas/Overlay"

    OverlayCreateResult:
      type: object
      required: [overlay, version]
      properties:
        overlay:
          $ref: "#/components/schemas/Overlay"
        version:
          $ref: "#/components/schemas/OverlayVersion"
        template:
          type: string
          description: Present when created via /overlays/from-template.

    OverlayDetail:
      type: object
      required: [overlay]
      properties:
        overlay:
          $ref: "#/components/schemas/Overlay"
        active_version:
          $ref: "#/components/schemas/OverlayVersion"
        active_warnings:
          type: array
          items:
            $ref: "#/components/schemas/OverlayWarning"

    OverlayVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/OverlayVersion"

    OverlayVersionResult:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/OverlayVersion"

    OverlayVersionDetail:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/OverlayVersion"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/OverlayWarning"

    OverlayAuditList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OverlayAuditEntry"

    OverlayShadowEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/OverlayShadowEvent"

    OverlayTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/OverlayTemplate"

    OverlayTemplateDetail:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/OverlayTemplate"

    # ============================================================
    # Governance — extension API + dashboard read views
    # ============================================================

    GovernanceSeverity:
      type: string
      enum: [low, medium, high]

    GovernanceAction:
      type: string
      enum: [logged, warned, blocked, redirected, overridden]

    GovernanceEventPayload:
      type: object
      required: [event_id, occurred_at, source_domain, severity, action]
      properties:
        event_id:
          type: string
          description: ULID or UUIDv7 generated by the extension; idempotency key
        user_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        source_domain:
          type: string
        rule_ids:
          type: array
          items:
            type: string
        severity:
          $ref: "#/components/schemas/GovernanceSeverity"
        action:
          $ref: "#/components/schemas/GovernanceAction"
        char_count_intercepted:
          type: integer
        browser:
          type: string
          enum: [chrome, edge, unknown]
        browser_version:
          type: string
        extension_version:
          type: string
        redirect_target_label:
          type: string
        override_justification:
          type: string

    GovernanceHeartbeat:
      type: object
      required: [install_id]
      properties:
        install_id:
          type: string
        extension_version:
          type: string
        browser:
          type: string
        browser_version:
          type: string

    GovernanceClassifyRequest:
      type: object
      properties:
        text_excerpt:
          type: string
        layer_3_hits:
          type: array
          items:
            type: string
        source_domain:
          type: string

    GovernanceClassifyResponse:
      type: object
      required: [severity, confidence, reasoning]
      properties:
        severity:
          $ref: "#/components/schemas/GovernanceSeverity"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        reasoning:
          type: string

    GovernanceDomainList:
      type: object
      properties:
        domains:
          type: array
          items:
            type: string
        etag:
          type: string
        updated:
          type: string
          format: date-time

    GovernanceExtensionPolicy:
      type: object
      properties:
        default_policy:
          type: object
          additionalProperties:
            type: string
            enum: [log, warn, block_redirect]
        custom_keywords:
          type: array
          items:
            type: string
        custom_regex_packs:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceRegexPack"
        override_enabled:
          type: boolean
        pseudonymize_pii:
          type: boolean
        domain_overrides:
          type: array
          items:
            type: string
        redirect_target:
          oneOf:
            - $ref: "#/components/schemas/GovernanceRedirectTarget"
            - type: "null"

    GovernanceRegexPack:
      type: object
      required: [id, pattern, severity]
      properties:
        id:
          type: string
        pattern:
          type: string
        severity:
          $ref: "#/components/schemas/GovernanceSeverity"
        label:
          type: string

    GovernanceRedirectTarget:
      type: object
      required: [url, label]
      properties:
        url:
          type: string
          format: uri
        label:
          type: string
        open_in_new_tab:
          type: boolean
        carry_over_supported:
          type: boolean

    GovernanceDomainCount:
      type: object
      required: [domain, count]
      properties:
        domain:
          type: string
        count:
          type: integer

    GovernanceRuleCount:
      type: object
      required: [rule_id, count]
      properties:
        rule_id:
          type: string
        count:
          type: integer

    GovernanceOverviewSummary:
      type: object
      required:
        [
          window_days,
          total_events,
          by_severity,
          by_action,
          unique_users,
          unique_domains,
          top_domains,
          top_rules,
        ]
      properties:
        window_days:
          type: integer
        total_events:
          type: integer
        by_severity:
          type: object
          additionalProperties:
            type: integer
        by_action:
          type: object
          additionalProperties:
            type: integer
        unique_users:
          type: integer
        unique_domains:
          type: integer
        top_domains:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceDomainCount"
        top_rules:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceRuleCount"

    GovernanceEventRow:
      type: object
      required:
        [
          event_id,
          occurred_at,
          user_id,
          source_domain,
          rule_ids,
          severity,
          action,
          char_count_intercepted,
          browser,
          browser_version,
          extension_version,
        ]
      properties:
        event_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        user_id:
          type: string
        source_domain:
          type: string
        rule_ids:
          type: array
          items:
            type: string
        severity:
          $ref: "#/components/schemas/GovernanceSeverity"
        action:
          $ref: "#/components/schemas/GovernanceAction"
        char_count_intercepted:
          type: integer
        browser:
          type: string
        browser_version:
          type: string
        extension_version:
          type: string
        redirect_target_label:
          type: string
        override_justification:
          type: string

    GovernanceDeploymentRow:
      type: object
      required: [org_id, install_id, last_seen_at]
      properties:
        org_id:
          type: string
          format: uuid
        install_id:
          type: string
        last_seen_at:
          type: string
          format: date-time
        browser:
          type: string
        browser_version:
          type: string
        extension_version:
          type: string

    GovernanceInstallation:
      type: object
      required: [ID, OrgID, Label, CreatedAt]
      properties:
        ID:
          type: string
          format: uuid
        CustomerID:
          type: string
          format: uuid
        OrgID:
          type: string
          format: uuid
        InstallationToken:
          type: string
          description: SHA-256 hex of the bearer token (not the plaintext)
        Label:
          type: string
        CreatedAt:
          type: string
          format: date-time
        RevokedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    GovernanceCreatedInstallation:
      type: object
      required: [id, org_id, label, installation_token, installation_secret]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        label:
          type: string
        installation_token:
          type: string
        installation_secret:
          type: string
          description: HKDF root secret. Shown ONCE — store immediately.
        managed_storage_config:
          type: object
          description: Pre-filled JSON ready for MDM deploy
          additionalProperties: true
        warning:
          type: string

    GovernanceCustomerPolicy:
      type: object
      required:
        [
          SeverityLow,
          SeverityMedium,
          SeverityHigh,
          CustomKeywords,
          CustomRegexPacks,
          OverrideEnabled,
          PseudonymizePII,
        ]
      properties:
        CustomerID:
          type: string
          format: uuid
        SeverityLow:
          type: string
          enum: [log, warn, block_redirect]
        SeverityMedium:
          type: string
          enum: [log, warn, block_redirect]
        SeverityHigh:
          type: string
          enum: [log, warn, block_redirect]
        CustomKeywords:
          type: array
          items:
            type: string
        CustomRegexPacks:
          type: array
          items:
            $ref: "#/components/schemas/GovernanceRegexPack"
        RedirectTarget:
          oneOf:
            - $ref: "#/components/schemas/GovernanceRedirectTarget"
