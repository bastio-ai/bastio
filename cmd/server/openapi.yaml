    WorkspaceSettings:
      type: object
      required: [customer_id, branding, seat_limit, retention_days, billing_mode, allowed_models, created_at, updated_at]
      properties:
        customer_id: { type: string, format: uuid }
        branding: { type: object, additionalProperties: true }
        default_assistant_id: { type: string, format: uuid, nullable: true }
        seat_limit: { type: integer }
        retention_days: { type: integer }
        spend_cap_cents: { type: integer, nullable: true }
        billing_mode: { type: string, enum: [platform_keys, byo_keys] }
        disable_image_attachments:
          type: boolean
          description: |
            When true, image uploads in workspace chat are rejected.
            Images are not text-extracted and therefore cannot pass
            through the text security pipeline used for documents.
        allowed_models:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceAllowedModel" }
          description: |
            Strict whitelist of LLM provider+model pairs surfaced in
            the employee chat's model picker. Empty = all curated
            defaults available; non-empty = strict whitelist (also
            enforced server-side as defense-in-depth).
        onboarding_completed_at: { type: string, format: date-time, nullable: true }
        slug: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceAllowedModel:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string, description: "OSS provider enum: openai | anthropic | bedrock | gemini | mistral | cohere | ollama" }
        model: { type: string, description: "Provider SDK model identifier (gpt-4o-mini, claude-haiku-4-5, etc.)" }

    WorkspaceSettingsPatch:
      type: object
      properties:
        branding: { type: object, additionalProperties: true }
        seat_limit: { type: integer }
        retention_days: { type: integer }
        spend_cap_cents: { type: integer, nullable: true }
        billing_mode: { type: string, enum: [platform_keys, byo_keys] }
        disable_image_attachments:
          type: boolean
          description: Reject image uploads in workspace chat.
        allowed_models:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceAllowedModel" }
          nullable: true

    WorkspaceAssistant:
      type: object
      required: [id, customer_id, name, default_provider, default_model, language, suggested_prompts, is_default, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        system_prompt: { type: string }
        default_provider: { type: string, enum: [openai, anthropic, bedrock, ollama, google] }
        default_model: { type: string }
        language: { type: string }
        suggested_prompts:
          type: array
          items: { type: string }
        is_default: { type: boolean }
        knowledge_source_ids:
          type: array
          items: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceAssistantPatch:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        system_prompt: { type: string }
        default_provider: { type: string }
        default_model: { type: string }
        language: { type: string }
        is_default:
          type: boolean
          description: |
            When true, promotes this assistant to be the workspace's
            default. Atomically clears any other default assistant.
            Omit (or pass false) to leave the current default
            untouched.
        suggested_prompts:
          type: array
          items: { type: string }
        knowledge_source_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            When present, replaces the assistant's full set of attached
            knowledge sources. Pass an empty array to detach all. Omit
            the field to leave attachments untouched.

    WorkspaceKnowledgeSource:
      type: object
      required: [id, customer_id, name, type, source_ref, size_bytes, status, metadata, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [file, url, text] }
        source_ref: { type: string }
        inline_text: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        size_bytes: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, processing, ready, failed, quarantined]
          description: |
            'quarantined' means the security engine blocked the
            content at ingest. No chunks are produced. An admin
            reviews the source and either releases (POST /release)
            or archives.
        error: { type: string, nullable: true }
        content_hash:
          type: string
          nullable: true
          description: SHA-256 of raw upload bytes (hex). NULL for inline-text sources.
        scan_result:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Snapshot of the ingest-time security scan. Populated only
            when the scan rewrote (sanitize) or blocked (quarantine)
            the source. Shape:
              { action: "block" | "sanitize" | "allow",
                categories: ["pii_email", "secrets"],
                threat_score: 0.92 }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceConversation:
      type: object
      required: [id, customer_id, user_id, title, pinned, last_message_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        user_id: { type: string }
        assistant_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        pinned: { type: boolean }
        last_message_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceConversationListItem:
      allOf:
        - $ref: "#/components/schemas/WorkspaceConversation"
        - type: object
          required: [message_count]
          properties:
            message_count: { type: integer }
            last_message_role: { type: string }
            last_message_peek: { type: string }

    WorkspaceMessage:
      type: object
      required: [id, conversation_id, customer_id, role, content, prompt_tokens, completion_tokens, cost_cents, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_cents: { type: integer }
        finish_reason: { type: string, nullable: true }
        error: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    WorkspaceSendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }
        provider: { type: string }
        model: { type: string }

    WorkspaceDomain:
      type: object
      required: [id, customer_id, domain, verification_token, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        domain: { type: string }
        verification_token: { type: string }
        verified_at: { type: string, format: date-time, nullable: true }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_check_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkspaceMember:
      type: object
      required: [customer_id, user_id, email, role, joined_at]
      properties:
        customer_id: { type: string, format: uuid }
        user_id: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        invited_by: { type: string, nullable: true }
        joined_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }

    WorkspaceInvitation:
      type: object
      required: [id, customer_id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        invited_by: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    WorkspaceAnalyticsSummary:
      type: object
      required: [messages_this_month, tokens_this_month, cost_cents_this_month, active_users, seat_limit]
      properties:
        messages_this_month: { type: integer }
        tokens_this_month: { type: integer }
