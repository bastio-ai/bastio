    UpdateSecurityProfileRequest:
      type: object
      description: Partial update — only provided fields change.
      properties:
        injection_enabled:
          type: boolean
        injection_threshold:
          type: number
        pii_enabled:
          type: boolean
        pii_action:
          type: string
          enum: [mask, tokenize, block, warn, log_only]
        pii_scan_response:
          type: boolean
          description: When true, scan the LLM response for PII that was not in the request (hallucination / RAG leak).
        pii_restore_response:
          type: boolean
          description: When true and pii_action=tokenize, swap placeholders back to originals before returning the response.
        pii_token_style:
          type: string
          enum: [angle, curly]
          description: Placeholder shape when pii_action=tokenize.
        jailbreak_enabled:
          type: boolean
        jailbreak_threshold:
          type: number
        bot_detection_enabled:
          type: boolean
        custom_patterns_enabled:
          type: boolean
        canonicalize_enabled:
          type: boolean
          description: Run unicode/homoglyph/base64 canonicalization before detectors. Recommended on.
        secrets_enabled:
          type: boolean
          description: Detect and mask API keys, cloud credentials, and private keys.
        indirect_injection_enabled:
          type: boolean
          description: Scan tool/retrieval/memory content for embedded prompt injection with stricter thresholds than user input.
        output_exfil_enabled:
          type: boolean
          description: Scan model responses for system-prompt reveal, echoed secrets, and training-data regurgitation.
        topic_policy_enabled:
          type: boolean
          description: Apply per-customer regex/keyword policy rules from security_patterns.
        injection_strategy:
          type: string
          enum: [block, warn, log_only]
          description: What happens when the injection step fires.
        jailbreak_strategy:
          type: string
          enum: [block, warn, log_only]
          description: What happens when the jailbreak step fires.
        secrets_strategy:
          type: string
          enum: [block, mask, warn, log_only]
          description: What happens when the secrets step fires. No tokenize — secrets must not round-trip.
        indirect_injection_strategy:
          type: string
          enum: [block, warn, log_only]
          description: What happens when the indirect_injection step fires (on tool/retrieval/memory content).
        output_exfil_strategy:
          type: string
          enum: [block, warn, log_only]
          description: What happens when the response-side exfil step fires.

